---
defaults:
    - _self_
    - override hydra/job_logging: stdout

# completely disable hydra logging
# https://github.com/facebookresearch/hydra/issues/910
hydra:
    output_subdir: null
    run:
        dir: .

paths:
    dc2: /nfs/turbo/lsa-regier/dc2_nersc
    cosmodc2: /nfs/turbo/lsa-regier/lsstdesc-public/dc2/cosmoDC2_v1.1.4
    dc2_cache: /nfs/turbo/lsa-regier/dc2_wl
    output: images_to_maps

variational_factors:
  - _target_: images_to_maps.variational_dist.IndependentMVNFactor
    name: shear_1
    dim: ${surveys.dc2.num_redshift_bins}
    nll_gating: null
  - _target_: images_to_maps.variational_dist.IndependentMVNFactor
    name: shear_2
    dim: ${surveys.dc2.num_redshift_bins}
    nll_gating: null
  - _target_: images_to_maps.variational_dist.IndependentMVNFactor
    name: convergence
    dim: ${surveys.dc2.num_redshift_bins}
    nll_gating: null

lensing_normalizers_nan:
    nan:
        _target_: images_to_maps.image_normalizer.NanNormalizer

lensing_normalizers_nanpsf:
    nan:
        _target_: images_to_maps.image_normalizer.NanNormalizer
    psf:
        _target_: images_to_maps.image_normalizer.PsfAsImage
        num_psf_params: 4

lensing_metrics:
    _target_: images_to_maps.metrics.WeakLensingMetrics
    num_redshift_bins: ${surveys.dc2.num_redshift_bins}

lensing_plots:
    _target_: images_to_maps.plots.WeakLensingPlots
    frequency: 1
    save_local: ${paths.output}/${train.trainer.logger.name}/${train.trainer.logger.version}/lensing_plots

encoder:
    _target_: images_to_maps.encoder.MassMapEncoder
    n_bands: 6
    res_init: 2048  # num pixels per side
    res_midpoint: 128
    res_final: 8  # num tiles per side
    ch_init: 64
    ch_max: 1024
    ch_final: 128
    initial_downsample: false
    more_up_layers: true
    num_bottleneck_layers: 0
    image_normalizers: ${lensing_normalizers_nanpsf}
    loss_mask_key: loss_mask  # loss and val/test metrics use only the crop interiors
    var_dist:
        _target_: images_to_maps.variational_dist.VariationalDist
        tile_slen: ${surveys.dc2.tile_slen}
        factors: ${variational_factors}
    optimizer_params:
        lr: 1e-4
    scheduler_params:
        milestones: []
        gamma: 1.0
    loss_plots_location: ${paths.output}/${train.trainer.logger.name}/${train.trainer.logger.version}/loss_plots
    mode_metrics:
        _target_: torchmetrics.MetricCollection
        _convert_: partial
        metrics: ${lensing_metrics}
    sample_metrics:
        _target_: torchmetrics.MetricCollection
        _convert_: partial
        metrics: ${lensing_metrics}
    sample_image_renders:
        _target_: torchmetrics.MetricCollection
        _convert_: partial
        metrics: ${lensing_plots}

surveys:
    dc2:
        _target_: images_to_maps.dc2.dc2.LensingDC2DataModule
        tile_slen: 256
        tracts: [3828, 3829]  # tracts to generate (generate_dc2_cache.py) and load
        # Train/val/test regions as rectangles of crops in each tract's 28 x 28 crop grid:
        # row = 4 * patch_y + crop_row (row 0 is the south edge), col = 4 * patch_x + crop_col.
        # Ranges are inclusive. Test takes precedence over val; all other crops are train.
        splits: null
        split_regions:
            test:  # 14 x 14 crops, RA 55.67-56.65, Dec -37.22 to -36.45
                - {tract: 3828, rows: [0, 13], cols: [14, 27]}
            val:  # L-shaped band, 6 crops wide, around the test block
                - {tract: 3828, rows: [0, 19], cols: [8, 27]}
        train_buffer_crops: 1  # drop train crops within this many crops of val/test
        avg_ellip_kernel_size: 15  # must be odd
        avg_ellip_kernel_sigma: 15
        redshift_quantiles: [0.00, 0.762988, 1.120420, 1.592735]
        num_redshift_bins: 4  # length of redshift_quantiles
        batch_size: 1
        num_workers: 1
        cached_data_path: ${paths.dc2_cache}
        exclude_file_list_path: null
        train_transforms:
            - _target_: images_to_maps.data_augmentation.LensingRotateFlipTransform
        shuffle_file_order: false  # partition train/val/test by ra/dec so that we can compute 2PCFs on spatially contiguous test set

mode: train

train:
    trainer:
        _target_: lightning.Trainer
        logger:
            _target_: lightning.pytorch.loggers.TensorBoardLogger
            save_dir: ${paths.output}
            name: results/dc2/npe
            version: padded_nanpsf_${encoder.ch_max}_${encoder.initial_downsample}_${encoder.more_up_layers}
            default_hp_metric: false
        reload_dataloaders_every_n_epochs: 0
        check_val_every_n_epoch: 1
        log_every_n_steps: 10
        max_epochs: 300
        accelerator: gpu
        devices: 1
        precision: 32-true
    callbacks:
        checkpointing:
            _target_: lightning.pytorch.callbacks.ModelCheckpoint
            filename: "encoder_{epoch}"
            save_top_k: 1
            verbose: true
            monitor: val/_loss
            mode: min
            save_on_train_epoch_end: false
        early_stopping:
            _target_: lightning.pytorch.callbacks.EarlyStopping
            monitor: val/_loss
            mode: min
            patience: 100
    data_source: ${surveys.dc2}
    encoder: ${encoder}
    seed: 123123
    pretrained_weights: null
    ckpt_path: null
    matmul_precision: high
