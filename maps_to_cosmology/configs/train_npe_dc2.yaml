defaults:
  - override hydra/job_logging: none

seed: 42

hydra:
  run:
    dir: .
  output_subdir: null

paths:
  data_dir: /data/scratch/convergence_maps/dc2_lognormal
  output: maps_to_cosmology

convergence_maps:
  batch_size: 32
  num_workers: 4
  val_split: 0.1
  test_split: 0.1
  standardize_params: false
  smoothing_sigma: 1.0

encoder:
  _target_: maps_to_cosmology.encoder.Encoder
  num_bins: 5
  num_cosmo_params: 6
  lr: 1e-4
  var_dist:
    _target_: maps_to_cosmology.distributions.FullRankMVN
    num_params: ${encoder.num_cosmo_params}
    diag_eps: 1e-6
    diag_clamp_low: -14
    diag_clamp_high: 10

train:
  trainer:
    max_epochs: 200
    accelerator: gpu
    devices: 1
    log_every_n_steps: 10
  logger:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${paths.output}
    name: results
    version: ${now:%m-%d|%H:%M:%S}
    default_hp_metric: false
  callbacks:
    checkpoint:
      filename: "encoder_{epoch:02d}"
      monitor: val_loss
      mode: min
      save_top_k: 1
    early_stopping:
      monitor: val_loss
      patience: 50
      mode: min
