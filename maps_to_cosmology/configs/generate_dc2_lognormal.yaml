defaults:
  - override hydra/job_logging: none

hydra:
  run:
    dir: .
  output_subdir: null

output_dir: /data/scratch/convergence_maps/dc2_lognormal
num_maps: 100000
seed: 42
combine_only: false  # If true, skip generation and just combine existing batch files
batch_size: 16

N: 64             # Resolution (64x64 tiles, cropped to 64x40)
map_size: 0.91022 # Field of view in degrees (0.2 arcsec/pixel * 256 pixels/tile / 3600 arcsec/degree * 64 tiles = ~0.91 degrees)
crop_width: 40    # Crop maps from 64x64 to 64x40 (height x width)

# Galaxy survey parameters
sigma_e: 0.26         # Intrinsic shape noise
gals_per_arcmin2: 27. # Galaxy density
nbins: 5              # Number of redshift bins

# Redshift distribution parameters (Smail distribution)
a: 2.0
b: 0.68
z0: 0.11

# Simulation settings
model_type: lognormal
with_noise: false

# Prior distributions for LambdaCDM parameters (WMAP-7 centers, LSST Y10 scales)
prior:
  omega_c:
    _target_: maps_to_cosmology.prior.TruncatedNormal
    loc: 0.22
    scale: 0.2
    low: 0.0
  omega_b:
    _target_: maps_to_cosmology.prior.TruncatedNormal
    loc: 0.048
    scale: 0.006
    low: 0.0
  sigma_8:
    _target_: maps_to_cosmology.prior.TruncatedNormal
    loc: 0.80
    scale: 0.14
    low: 0.0
  h_0:
    _target_: maps_to_cosmology.prior.TruncatedNormal
    loc: 0.71
    scale: 0.063
    low: 0.0
  n_s:
    _target_: maps_to_cosmology.prior.TruncatedNormal
    loc: 0.963
    scale: 0.08
    low: 0.0
  w_0:
    _target_: maps_to_cosmology.prior.TruncatedNormal
    loc: -1.0
    scale: 0.9
    low: -2.0
    high: -0.3
